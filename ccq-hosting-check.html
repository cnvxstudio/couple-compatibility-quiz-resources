<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width"><title>Podcast hosting check</title><style>body{max-width:60rem;margin:2rem auto;padding:1rem;font:1rem/1.6 system-ui}pre{white-space:pre-wrap}button{padding:1rem}</style><h1>Podcast hosting check</h1><p>This checks only the fixed audio, cover and feed files on this same origin. No form data or third-party analytics.</p><button id="check">Check hosting</button><pre id="result" role="status">Not checked</pre><script>document.getElementById('check').addEventListener('click',async function(){this.disabled=true;const lines=[];const result=document.getElementById('result');const write=line=>{lines.push(line);result.textContent=lines.join('\n')};try{for(const path of ['ccq-podcast.xml','ccq-podcast-cover.jpg','ccq-episode-001.mp3']){const r=await fetch(path,{method:'HEAD',cache:'no-cache',credentials:'omit'});write(JSON.stringify({path,method:'HEAD',status:r.status,type:r.headers.get('content-type'),length:r.headers.get('content-length'),acceptRanges:r.headers.get('accept-ranges')}));if(r.status!==200)throw new Error('HEAD failed '+path)}const range=await fetch('ccq-episode-001.mp3',{headers:{Range:'bytes=0-1023'},cache:'no-cache',credentials:'omit'});const bytes=(await range.arrayBuffer()).byteLength;write(JSON.stringify({path:'ccq-episode-001.mp3',method:'GET Range bytes=0-1023',status:range.status,contentRange:range.headers.get('content-range'),receivedBytes:bytes}));if(range.status!==206||bytes!==1024)throw new Error('Audio byte-range check failed');const xml=await(await fetch('ccq-podcast.xml',{cache:'no-cache',credentials:'omit'})).text();const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid XML');const enclosures=[...doc.querySelectorAll('enclosure')];if(enclosures.length!==1||enclosures[0].getAttribute('length')!=='3689904')throw new Error('Wrong enclosure');write('PASS: HEAD, audio byte range and current enclosure length. Human listening and Apple acceptance remain separate.')}catch(e){write('FAIL: '+e.message)}finally{this.disabled=false}});</script></html>
